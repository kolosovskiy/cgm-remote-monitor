services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  pgdata:
